<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kiosk Clock</title>
<style>
  /* ---- knobs are in the <script> at the bottom, colors are here ---- */
  :root {
    --void:   #000000;   /* true OLED black — pixels off        */
    --ink:    #e9ecf5;   /* the time itself                     */
    --dim:    #5b6478;   /* date / eyebrow, deliberately quiet  */
    --accent: #4fd6c4;   /* the one bright thing: seconds sweep */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;               /* no scroll on a kiosk        */
    background: var(--void);
    color: var(--ink);
    font-family: "Roboto", -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    cursor: none;                   /* hide pointer on the panel   */
  }

  /* ---- the stage does the slow anti-burn-in wander ---- */
  .stage {
    position: relative; z-index: 1;
    height: 100%;
    display: grid; place-items: center;
    animation: burn-in-drift 137s ease-in-out infinite alternate;
  }
  @keyframes burn-in-drift {
    from { transform: translate(-14px, -10px); }
    to   { transform: translate( 14px,  10px); }
  }

  /* ---- the clock block fades/settles in on load ---- */
  .clock {
    position: relative;
    display: grid; place-items: center;
    text-align: center;
    animation: materialize 1.6s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes materialize {
    from { opacity: 0; transform: translateY(12px) scale(.985); filter: blur(6px); }
    to   { opacity: 1; transform: none;                          filter: blur(0);   }
  }

  /* the sweep ring sits behind the digits, same grid cell */
  .ring, .readout { grid-area: 1 / 1; }

  .ring { width: min(78vmin, 620px); height: min(78vmin, 620px); }
  .ring circle { fill: none; }
  .track { stroke: #ffffff; opacity: .05; stroke-width: 2; }
  .sweep {
    stroke: var(--accent);
    stroke-width: 3;
    stroke-linecap: round;
    transform: rotate(-90deg);              /* start at 12 o'clock */
    transform-origin: 50% 50%;
    will-change: stroke-dashoffset;         /* keep it on its own layer */
  }

  .readout { display: grid; gap: .4em; }

  .eyebrow {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: clamp(11px, 2.4vmin, 16px);
    letter-spacing: .42em;
    text-transform: uppercase;
    color: var(--dim);
    padding-left: .42em;                     /* balance the tracking */
  }

  .time {
    font-weight: 200;
    font-size: clamp(64px, 22vmin, 240px);
    line-height: .9;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;      /* digits never jitter */
  }
  .time .colon { animation: pulse 2s steps(1) infinite; }
  @keyframes pulse { 50% { opacity: .28; } }

  .date {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: clamp(13px, 3vmin, 22px);
    letter-spacing: .18em;
    color: var(--dim);
  }

  /* respect the OS "reduce motion" setting: kill every animation */
  @media (prefers-reduced-motion: reduce) {
    .aurora, .stage, .clock, .time .colon { animation: none; }
    .sweep { transition: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="clock" id="clock">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="47" />
        <circle class="sweep" id="sweep" cx="50" cy="50" r="47" />
      </svg>

      <div class="readout">
        <div class="eyebrow" id="eyebrow"></div>
        <div class="time" id="time"></div>
        <div class="date" id="date"></div>
      </div>
    </div>
  </div>

<script>
  /* ============================ KNOBS ============================ */
  const USE_24H       = true;   // false -> 12-hour with no AM/PM clutter
  const NIGHT_DIM     = true;   // dim the whole panel late at night
  const NIGHT_START   = 21;     // 21:00 -> start dimming (your ~8-9pm gate)
  const NIGHT_END     = 6;      // 06:00 -> back to full brightness
  const NIGHT_OPACITY = 0.42;   // how dark it goes at night (0-1)
  const EYEBROW_TEXT  = "";     // e.g. "OKINAWA" — leave "" to hide it
  const TZ            = "Asia/Tokyo";  // clock always shows this zone, ignores the device
  const DASHBOARD_URL = "";     // only used if Fully's JS interface is off — e.g. "http://<ha-ip>:8123/lovelace/0"
  /* =============================================================== */

  const C = 2 * Math.PI * 47;                 // circumference of r=47 ring
  const sweep   = document.getElementById("sweep");
  const timeEl  = document.getElementById("time");
  const dateEl  = document.getElementById("date");
  const eyebrow = document.getElementById("eyebrow");
  sweep.style.strokeDasharray = C;
  eyebrow.textContent = EYEBROW_TEXT;

  const pad = n => String(n).padStart(2, "0");
  let lastMinute = -1;

  // build the timezone formatters once, then reuse them every minute
  const timeFmt = new Intl.DateTimeFormat("en-GB",
    { timeZone: TZ, hourCycle: "h23", hour: "2-digit", minute: "2-digit" });
  const dateFmt = new Intl.DateTimeFormat(undefined,
    { timeZone: TZ, weekday: "long", day: "numeric", month: "long" });

  function frame() {
    const now = new Date();
    const s   = now.getSeconds() + now.getMilliseconds() / 1000;

    // smooth sweep: fraction of the current minute elapsed
    sweep.style.strokeDashoffset = C * (1 - s / 60);

    // only rebuild the text when the minute actually changes
    if (now.getMinutes() !== lastMinute) {
      lastMinute = now.getMinutes();

      const parts = timeFmt.formatToParts(now);
      const hr24  = +parts.find(p => p.type === "hour").value;    // Tokyo hour, 0-23
      const mm    =  parts.find(p => p.type === "minute").value;  // already padded

      let h = hr24;
      if (!USE_24H) h = (h % 12) || 12;
      timeEl.innerHTML = pad(h) + '<span class="colon">:</span>' + mm;

      dateEl.textContent = dateFmt.format(now);                   // date in Tokyo too

      // night auto-dim (uses the Tokyo hour)
      if (NIGHT_DIM) {
        const night = (NIGHT_START > NIGHT_END)
          ? (hr24 >= NIGHT_START || hr24 < NIGHT_END)   // window crosses midnight
          : (hr24 >= NIGHT_START && hr24 < NIGHT_END);
        document.body.style.transition = "opacity 4s ease";
        document.body.style.opacity = night ? NIGHT_OPACITY : 1;
      }
    }
    requestAnimationFrame(frame);
  }
  // touch anywhere -> back to the dashboard (this is your night-time tap-to-wake;
  // works alongside the PIR motion path during the day)
  addEventListener("pointerdown", () => {
    if (window.fully && fully.loadStartUrl) fully.loadStartUrl();  // Fully: go to Start URL
    else if (DASHBOARD_URL) location.href = DASHBOARD_URL;         // fallback for a plain browser
  });

  frame();
</script>
</body>
</html>
